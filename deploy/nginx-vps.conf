# ============================================================
# Nginx — site + API própria na mesma VPS.
# Copie para /etc/nginx/sites-available/mro e ative com:
#   ln -s /etc/nginx/sites-available/mro /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# O certbot ajusta os blocos de TLS automaticamente.
# ============================================================

# ---------- Site (React) ----------
server {
    listen 80;
    listen [::]:80;
    server_name maisresultadosonline.com.br www.maisresultadosonline.com.br;

    root /var/www/mro/dist;
    index index.html;

    client_max_body_size 300M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida entrega o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache, senão o deploy não aparece para quem já visitou.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}

# ---------- API própria (REST, Auth, Storage, Funções, Realtime) ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.maisresultadosonline.com.br;

    # Igual ao limite de upload atual do projeto.
    client_max_body_size 300M;
    client_body_timeout 600s;

    # Arquivos públicos servidos direto pelo disco: não passa pelo Node,
    # o que reduz drasticamente o custo de vídeos e imagens.
    # ATENÇÃO: com `alias`, `try_files $uri` compara o URI COMPLETO com o
    # diretório do alias e devolve 404 mesmo com o arquivo no disco. Por isso
    # usamos regex + captura, que é a única forma correta de mapear o caminho.
    location ~ ^/storage/v1/object/public/(?<storage_path>.+)$ {
        alias /var/www/uploads/$storage_path;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        # Necessário para o player buscar trechos do vídeo (seek).
        add_header Accept-Ranges bytes;
    }

    # WebSocket do realtime.
    location /realtime/v1 {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Webhooks (Meta, Stripe, InfiniPay) precisam do corpo intacto.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
